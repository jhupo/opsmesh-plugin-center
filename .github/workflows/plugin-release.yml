name: Publish remote plugin descriptor
on:
  workflow_call:
    inputs:
      sdk-commit:
        type: string
        required: true
      manifest:
        type: string
        default: plugin.json
      publisher-key-id:
        type: string
        required: true
      platform-requires:
        type: string
        required: true
      sdk-requires:
        type: string
        required: true
      license:
        type: string
        required: true
    secrets:
      signing-key:
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source identity
        env:
          SDK_COMMIT: ${{ inputs.sdk-commit }}
        run: |
          [[ "$SDK_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor HEAD "origin/$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")"
      - name: Install pinned publisher SDK
        env:
          SDK_COMMIT: ${{ inputs.sdk-commit }}
        run: python -m pip install "opsmesh-plugin-sdk[signing] @ https://github.com/jhupo/opsmesh-plugin-sdk-python/archive/$SDK_COMMIT.tar.gz"
      - name: Sign data-only descriptor
        env:
          OPSMESH_PLUGIN_SIGNING_KEY: ${{ secrets.signing-key }}
          RELEASE_TAG: ${{ github.ref_name }}
          MANIFEST: ${{ inputs.manifest }}
          PUBLISHER: ${{ inputs.publisher-key-id }}
          PLATFORM_REQUIRES: ${{ inputs.platform-requires }}
          SDK_REQUIRES: ${{ inputs.sdk-requires }}
          PLUGIN_LICENSE: ${{ inputs.license }}
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-release"
          opsmesh-plugin-publish "$MANIFEST" "$RUNNER_TEMP/plugin-release/release.json" --publisher-key-id "$PUBLISHER" --platform-requires "$PLATFORM_REQUIRES" --sdk-requires "$SDK_REQUIRES" --license "$PLUGIN_LICENSE" --repository "https://github.com/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" > "$RUNNER_TEMP/plugin-release/SHA256SUMS"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: '${{ runner.temp }}/plugin-release/*'
      - name: Publish immutable descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "$RUNNER_TEMP/plugin-release/release.json" "$RUNNER_TEMP/plugin-release/SHA256SUMS" --verify-tag --generate-notes
