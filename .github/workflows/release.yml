name: SDK release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python -c "import os,re,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?',version); assert os.environ['RELEASE_TAG']=='v'+version"
  check:
    needs: identity
    uses: ./.github/workflows/ci.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-distributions-${{ github.run_id }}
          path: dist
      - name: Hash the verified distributions
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: 'dist/*'
      - name: Publish the same verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *rc* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes "${flags[@]}"
