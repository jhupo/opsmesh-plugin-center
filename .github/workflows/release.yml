name: Package release
on:
  push:
    tags: ['sdk/v*', 'plugins/*/v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.identity.outputs.package }}
      path: ${{ steps.identity.outputs.path }}
      image: ${{ steps.identity.outputs.image }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re, tomllib
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"(sdk|plugins/[a-z][a-z0-9-]*)/v([0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?)", tag)
          assert match, "Invalid package tag"
          path, version = match.groups()
          package = tomllib.loads((pathlib.Path(path)/"pyproject.toml").read_text())["project"]
          assert package["version"] == version
          if path != "sdk":
              assert json.loads((pathlib.Path(path)/"plugin.json").read_text())["version"] == version
          print("package=" + package["name"])
          print("path=" + path)
          print("version=" + version)
          image = ""
          if path != "sdk":
              assert (pathlib.Path(path)/"deploy/Dockerfile").is_file(), "Plugin needs a runtime image"
              image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower() + "-" + path.split("/")[-1]
          print("image=" + image)
          PY
  gate:
    needs: identity
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [identity, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions-${{ needs.identity.outputs.package }}-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.path != 'sdk'
        with:
          name: distributions-opsmesh-plugin-sdk-${{ github.run_id }}
          path: sdk-dist
      - name: Prepare wheel-only image context
        if: needs.identity.outputs.path != 'sdk'
        env:
          PACKAGE_PATH: ${{ needs.identity.outputs.path }}
        run: |
          mkdir -p image-context/dist
          cp dist/*.whl sdk-dist/*.whl image-context/dist/
          cp dist/runtime-requirements.txt image-context/dist/
          cp "$PACKAGE_PATH/deploy/Dockerfile" image-context/Dockerfile
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: needs.identity.outputs.path != 'sdk'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: needs.identity.outputs.path != 'sdk'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: needs.identity.outputs.path != 'sdk'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        if: needs.identity.outputs.path != 'sdk'
        with:
          context: image-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.identity.outputs.image }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        if: needs.identity.outputs.path != 'sdk'
        with:
          subject-name: ${{ needs.identity.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Sign plugin descriptor with the verified SDK wheel
        if: needs.identity.outputs.path != 'sdk'
        env:
          OPSMESH_PLUGIN_SIGNING_KEY: ${{ secrets.OPSMESH_PLUGIN_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ needs.identity.outputs.path }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          CONTAINER_IMAGE: ${{ needs.identity.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          python -m pip install sdk-dist/*.whl cryptography==50.0.1
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          path = pathlib.Path(os.environ["PACKAGE_PATH"])
          release = tomllib.loads((path / "release.toml").read_text())
          project = tomllib.loads((path / "pyproject.toml").read_text())["project"]
          subprocess.run([
              "opsmesh-plugin-publish", str(path / "plugin.json"), "dist/release.json",
              "--tag-prefix", str(path) + "/v",
              "--publisher-key-id", release["publisher_key_id"],
              "--platform-requires", release["platform_requires"],
              "--sdk-requires", release["sdk_requires"],
              "--license", project["license"],
              "--repository", os.environ["SOURCE_REPOSITORY"],
              "--commit", os.environ["SOURCE_COMMIT"],
              "--container-image", os.environ["CONTAINER_IMAGE"],
          ], check=True)
          PY
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: 'dist/*'
      - name: Promote the signed image digest
        if: needs.identity.outputs.path != 'sdk'
        env:
          IMAGE: ${{ needs.identity.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PACKAGE_VERSION: ${{ needs.identity.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:$PACKAGE_VERSION" "$IMAGE@$IMAGE_DIGEST"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *rc* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
