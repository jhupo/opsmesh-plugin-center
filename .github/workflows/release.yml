name: SDK release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG'] == 'v'+version, 'Tag must match package version'"
      - run: uv sync --frozen --extra signing
      - run: uv build
      - run: uv run twine check --strict dist/*
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" *.whl *.tar.gz SHA256SUMS --verify-tag --generate-notes
