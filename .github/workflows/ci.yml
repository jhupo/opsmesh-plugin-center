name: SDK CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.10'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra signing
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m compileall -q src
      - run: uv build
      - run: uv run twine check --strict dist/*
      - name: Check installed wheel without backend source
        run: |
          uv venv /tmp/sdk-wheel
          uv pip install --python /tmp/sdk-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/sdk-wheel/bin/python -c "from opsmesh_plugin_sdk import client, contracts, packages, webhooks; import importlib.metadata; assert importlib.metadata.metadata('opsmesh-plugin-sdk')['License-Expression'] == 'Apache-2.0'"
