name: Plugin Center CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: discover
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, tomllib
          paths = [pathlib.Path("sdk"), *sorted(pathlib.Path("plugins").iterdir())]
          packages = [{"path": str(p), "name": tomllib.loads((p/"pyproject.toml").read_text())["project"]["name"]} for p in paths if p.is_dir()]
          print("matrix=" + json.dumps({"include": packages}))
          PY
  check:
    needs: packages
    strategy:
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.10'
          python-version: '3.11'
      - run: uv sync --locked --all-packages --all-extras --all-groups
      - run: uv run python scripts/check_package.py "${{ matrix.path }}"
      - run: uv run ruff check --config "${{ matrix.path }}/pyproject.toml" "${{ matrix.path }}"
      - run: uv run mypy --config-file "${{ matrix.path }}/pyproject.toml" "${{ matrix.path }}/src"
      - run: uv run python -m compileall -q "${{ matrix.path }}/src"
      - name: Plugin assets
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          if [ -f "$PACKAGE_PATH/scripts/check_assets.py" ]; then
            uv run python "$PACKAGE_PATH/scripts/check_assets.py"
          fi
      - name: Product flow
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          if [ -d "$PACKAGE_PATH/tests" ]; then
            uv run pytest -c "$PACKAGE_PATH/pyproject.toml" "$PACKAGE_PATH/tests"
          fi
      - run: uv build --package "${{ matrix.name }}" --out-dir dist
      - run: uv run twine check --strict dist/*
      - name: Export locked plugin runtime dependencies
        if: matrix.path != 'sdk'
        run: uv export --locked --package "${{ matrix.name }}" --no-dev --no-emit-workspace --output-file dist/runtime-requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions-${{ matrix.name }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
