[project]
name = "opsmesh-plugin-sdk"
version = "0.5.0"
description = "Python SDK for OpsMesh remote plugins and message connectors"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "packaging>=26,<27"]

[project.scripts]
opsmesh-plugin-publish = "opsmesh_plugin_sdk.packaging.publish:main"

[project.optional-dependencies]
signing = ["cryptography>=48"]

[project.urls]
Homepage = "https://github.com/jhupo/opsmesh-plugin-center"
Repository = "https://github.com/jhupo/opsmesh-plugin-center"
Issues = "https://github.com/jhupo/opsmesh-plugin-center/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsmesh_plugin_sdk = ["py.typed"]

[dependency-groups]
dev = ["ruff>=0.12,<1", "mypy>=1.17,<2", "twine>=6,<7"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
